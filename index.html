    <!-- Primary SEO Meta Tags -->
    <!-- Safe static fallback: document.title is a singleton, so this never
         duplicates — Helmet overwrites it cleanly on every route. -->
    <title>Rangrez Holidays | Private India Tours & Chauffeur Taxi</title>
    <!--
      NOTE: <meta name="description"> and <link rel="canonical"> are
      intentionally NOT set here anymore (unlike <title> above). They are
      now set per-page by
      react-helmet-async (see src/data/seoData.ts and each page's <Helmet>
      block). Leaving static versions of these tags here would
      risk react-helmet-async rendering a SECOND, duplicate tag alongside
      them instead of cleanly replacing them, which creates an ambiguous
      canonical / duplicate title signal for Google — worse than having
      none in the static HTML at all. Browsers without JS (and the very
      first, non-rendering crawl pass) will simply see no title/description/
      canonical until Helmet mounts; Google's standard rendering pass does
      execute the JS and will see the correct per-page values.
    -->
